name: Build Fork Images

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-publish:
    name: Build and publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        component:
          - server
          - webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Record immutable image reference
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### ${{ matrix.component }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:${{ github.sha }}@$IMAGE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
